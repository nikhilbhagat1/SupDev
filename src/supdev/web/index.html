<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Supdev — Engineering Agent</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<header class="topnav">
  <a class="logo" href="/"><span class="logomark">S</span>Supdev</a>
  <button class="navlink" id="nav-board">Board</button>
  <a class="navlink" href="/settings">Settings</a>
  <div class="spacer"></div>
  <div class="seg" id="modeseg" role="tablist" aria-label="Mode"></div>
  <button id="create" class="primary">＋ Create</button>
  <div class="popwrap">
    <button id="avatar" class="avatar" aria-label="Account">?</button>
    <div id="usermenu" class="popover" hidden>
      <div class="who" id="whoami"></div><div class="sub" id="whosub"></div>
      <div class="field tokenauth" hidden><label for="token">API token</label><input id="token" type="password" placeholder="paste your token"></div>
      <div class="field devauth"><label for="tenant">Tenant</label><input id="tenant"></div>
      <div class="field devauth"><label for="user">User</label><input id="user"></div>
      <div class="field devauth"><label for="role">Role</label>
        <select id="role"><option>viewer</option><option>developer</option><option>sre</option><option selected>lead</option><option>admin</option></select></div>
      <div class="row" style="margin-top:8px"><a class="btn subtle" href="/settings">⚙ Settings</a><button id="signout" class="subtle tokenauth" hidden>Sign out</button></div>
    </div>
  </div>
</header>
<div class="workspace">
  <aside id="chatpanel" class="chatpanel" aria-label="Ticket chat" hidden></aside>
  <main><div id="content"></div></main>
</div>
<div id="toasts" class="toasts"></div>
<script src="/static/common.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
